; ESP32-C3 有线桥（方案验证 v0）
; PC(USB-Serial-JTAG CDC) <-> FOC(UART1) 纯透传
; 上传: pio run -t upload   监视: pio device monitor
; 详见同目录 README.md

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; C3 无 USB-OTG：使用硬件 USB-Serial-JTAG 作为 CDC 串口
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
