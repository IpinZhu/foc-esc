; ESP32-C3 有线桥（方案验证 v0）
; PC <-> FOC 透传。上传: pio run -t upload   监视: pio device monitor
; 详见同目录 README.md（含"你的板子是哪种 USB"判别方法）

[platformio]
default_envs = esp32c3_usb

; 形态一（多数单口 C3 板）：USB 直连模组 GPIO18/19（USB-Serial-JTAG）
; 烧录与桥的 CDC 口是同一个 USB 口，无需 BOOT 键。
[env:esp32c3_usb]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

; 形态二：板载 CH340/CP210x 转 UART0 的板子
; PC 侧透传改走 UART0；烧录同样走该 USB（板载自动下载电路）。
; 注意：上位机每次打开串口可能令 C3 复位一次（DTR/RTS 自动进 Boot 电路），属正常。
[env:esp32c3_uart0]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=0

; 形态三：无 FOC 板时的链路验证——C3 在 CDC 口上模拟 FOC 的 ASCII 应答
; （仅台架验证用，非透传固件；验证完刷回默认环境即可）
[env:esp32c3_responder]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBRIDGE_MODE_RESPONDER=1
